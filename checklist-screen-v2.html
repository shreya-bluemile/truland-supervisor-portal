<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handover Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9ebee; --rail:#16181c; --card:#ffffff; --soft:#f5f6f7; --line:#e8eaed; --line-strong:#d3d6da;
    --text:#16181c; --muted:#6b7078; --faint:#a3a8af;
    --red:#ee1c2e; --red-soft:#fde8ea; --red-line:#f6c3c8;
    --green:#1f8a5b; --green-soft:#e3f4ec;
    --amber:#c77d0a; --amber-soft:#fdf3e1;
    --purple:#6d3fd8; --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
  a{color:inherit;text-decoration:none;}
  svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
  [hidden]{display:none !important;}

  .app{display:flex;min-height:100vh;}

  /* Left rail — same as the rest of the tablet app */
  .rail{width:64px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:14px;flex:none;position:sticky;top:0;height:100vh;}
  .logo{font-weight:800;font-size:20px;letter-spacing:-1px;color:#fff;margin-bottom:6px;}
  .logo span{color:var(--red);}
  .rail-btn{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#b9bdc4;}
  .rail-btn svg{width:18px;height:18px;}
  .rail-btn.menu{width:26px;height:26px;background:#2a2d33;border-radius:6px;margin-bottom:6px;}
  .rail-btn.menu svg{width:14px;height:14px;}
  .rail-btn.active{background:var(--red);color:#fff;}

  .main{flex:1;min-width:0;padding:14px 20px 32px;}
  .wrap{max-width:980px;margin:0 auto;}
  .wrap.with-logs{max-width:none;}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .back{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;min-height:36px;padding-right:8px;}
  .back .crumb{color:var(--muted);font-weight:500;}
  .search{margin-left:auto;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;width:180px;color:var(--faint);font-size:11px;}
  .search svg{margin-left:auto;}
  .bell{width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--amber);}

  .card{background:var(--card);border-radius:var(--radius);}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:8px;padding:0 12px;height:36px;font-size:12px;font-weight:600;background:#fff;white-space:nowrap;}
  .btn:hover{background:var(--soft);}
  .btn.dark{background:var(--text);border-color:var(--text);color:#fff;}
  .btn.dark:hover{background:#2b2e34;}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:5px;padding:2px 8px;white-space:nowrap;}
  .pill.green{background:var(--green-soft);color:var(--green);}
  .pill.red{background:var(--red-soft);color:var(--red);}
  .pill.grey{background:var(--soft);color:var(--muted);}
  .count{font-size:10.5px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:4px;padding:1px 6px;}
  .avatar{border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;}
  .avatar.sm{width:22px;height:22px;font-size:8.5px;}
  .avatar.md{width:30px;height:30px;font-size:10.5px;}
  .av-MT{background:#e08a0b;}
  .av-PR{background:#d8457a;}
  .av-SK{background:#3b6fd8;}
  /* ---- Question list — one card, rows divided like the original ---- */
  .qlist{overflow:hidden;}
  .q{border-top:1px solid var(--line);}
  .q:first-child{border-top:none;}
  .q.flagged{box-shadow:inset 3px 0 0 var(--red);}
  .q-row{display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;min-height:56px;cursor:pointer;}
  .q-row:hover{background:#fafbfb;}
  .q.open .q-row{background:#fafbfb;}
  .num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;background:var(--green-soft);color:var(--green);}
  .q.flagged .num{background:var(--red-soft);color:var(--red);}
  .q-text{font-size:14px;font-weight:600;min-width:0;}
  .q-sum{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none;}
  .ans-split{display:inline-flex;border-radius:6px;overflow:hidden;font-size:11px;font-weight:700;}
  .ans-split span{padding:3px 8px;display:inline-flex;align-items:center;gap:4px;}
  .ans-split svg,.ans svg{width:11px;height:11px;stroke-width:2.6;}
  .ans{display:inline-flex;align-items:center;gap:4px;}
  .a-ok{background:var(--green-soft);color:var(--green);}
  .a-bad{background:var(--red-soft);color:var(--red);}
  .logs-link{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 10px;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--muted);}
  .logs-link:hover{background:var(--soft);color:var(--text);}
  .chev{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--faint);transition:transform .2s;}
  .q.open .chev{transform:rotate(180deg);color:var(--text);}

  .q-body{padding:4px 20px 18px 54px;}
  .verdict{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:8px 12px;border-radius:8px;margin:8px 0 6px;}
  .verdict.bad{background:var(--red-soft);color:#a3121f;}
  .verdict.ok{background:var(--green-soft);color:#17684a;}
  .verdict b{font-weight:700;}
  .resp{display:flex;gap:12px;padding:12px 0;}
  .resp + .resp{border-top:1px dashed var(--line-strong);}
  .resp-main{flex:1;min-width:0;}
  .resp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .resp-head b{font-size:12.5px;font-weight:600;}
  .resp-head time{font-size:11px;color:var(--muted);}
  .ans{font-size:11px;font-weight:700;border-radius:5px;padding:2px 8px;}
  .tags{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .tag{font-size:10.5px;font-weight:600;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px;}
  .tag svg{width:11px;height:11px;}
  .note{margin-top:8px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12px;line-height:1.5;color:#3c4047;}
  .note b{color:var(--text);}
  .files{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px;}
  .file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:0 6px 0 10px;min-height:52px;background:#fff;}
  .file-ic{width:32px;height:32px;border-radius:8px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;flex:none;}
  .file-name{font-size:12.5px;font-weight:600;}
  .file-sub{font-size:10.5px;color:var(--muted);}
  .file-actions{margin-left:auto;display:flex;}
  .icon-btn{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);}
  .icon-btn:hover{background:var(--soft);color:var(--text);}
  .photos{display:flex;gap:8px;margin-top:10px;}
  .thumb{width:96px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);position:relative;}
  .thumb svg{width:100%;height:100%;display:block;}

  /* ---- View logs: a panel on the right, next to the list (read-only) ---- */
  .layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start;}
  .with-logs .layout{grid-template-columns:minmax(0,1fr) 360px;}
  .with-logs .q-sum .count{display:none;}
  .with-logs .files{grid-template-columns:1fr;}
  .with-logs .logs-link .lbl{display:none;}
  .with-logs .logs-link{width:36px;padding:0;justify-content:center;}
  .q.logs-on .q-row{background:var(--soft);}
  .logs-link.on{background:var(--text);color:#fff;}
  .logs-panel{position:sticky;top:14px;max-height:calc(100vh - 28px);display:flex;flex-direction:column;overflow:hidden;}
  .lp-head{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;}
  .lp-eyebrow{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .lp-eyebrow svg{width:12px;height:12px;}
  .lp-head h2{font-size:14px;font-weight:700;margin-top:4px;line-height:1.35;}
  .lp-head .icon-btn{margin-left:auto;border:1px solid var(--line);flex:none;}
  .lp-nav{display:flex;gap:6px;margin-top:8px;}
  .lp-body{flex:1;overflow-y:auto;padding:16px 16px 4px;}
  .tl{position:relative;padding-left:32px;}
  .tl::before{content:"";position:absolute;left:10px;top:6px;bottom:18px;width:2px;background:var(--line);}
  .ev{position:relative;padding-bottom:14px;}
  .ev .dot{position:absolute;left:-32px;top:0;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:var(--muted);}
  .ev .dot svg{width:11px;height:11px;}
  .ev .avatar{position:absolute;left:-32px;top:0;}
  .ev-top{display:flex;align-items:center;gap:8px;font-size:12.5px;min-height:22px;}
  .ev-top time{margin-left:auto;font-size:11px;color:var(--muted);}
  .ev-sub{margin-top:6px;display:flex;flex-direction:column;gap:4px;}
  .ev-line{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#3c4047;background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 10px;}
  .ev-line svg{color:var(--muted);width:12px;height:12px;}

  @media (max-width:820px){
    .rail{display:none;}
    .q-body{padding-left:20px;}
    .files{grid-template-columns:1fr;}
    .with-logs .layout{grid-template-columns:1fr;}
    .logs-panel{position:static;max-height:none;}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="logo">T<span>H</span></div>
    <button class="rail-btn menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="rail-btn active" aria-label="Dashboard"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
    <button class="rail-btn" aria-label="Schedule"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></button>
    <button class="rail-btn" aria-label="Tasks"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4v2h6V4M9 13l2 2 4-4"/></svg></button>
    <button class="rail-btn" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
  </nav>

  <main class="main">
    <div class="wrap" id="wrap">
      <div class="topbar">
        <a class="back" href="client-handover-mockup.html"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Checklist</a>
        <label class="search">Search<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></label>
        <button class="bell" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></button>
      </div>

      <div class="layout">
        <section class="card qlist" id="qlist"></section>
        <aside class="card logs-panel" id="logs" aria-label="Question logs" hidden></aside>
      </div>
    </div>
  </main>
</div>


<script>
  // One entry per question. `bad` is the answer that needs follow-up — a question is
  // flagged when anyone gave it. Answers are coloured by that, not by Yes/No.
  const PEOPLE = { MT: 'Mike T.', PR: 'Priya R.', SK: 'Sarah K.' };
  const Q = [
    { q: 'Site left clean and all rubbish removed?', bad: 'No', r: [
      { by: 'MT', a: 'Yes', t: '13-08-2026, 02:05 PM' } ] },
    { q: 'Was the client present at handover?', bad: 'No', r: [
      { by: 'MT', a: 'Yes', t: '13-08-2026, 02:12 PM', tags: ['Note added'], note: 'Walked the client through at 10am. Skip bin not collected — contractor booked for Tue.' },
      { by: 'PR', a: 'No', t: '11-08-2026, 03:05 PM', tags: ['Staff notified'] } ] },
    { q: 'Finish matches the agreed specification?', bad: 'No', r: [
      { by: 'MT', a: 'Yes', t: '13-08-2026, 02:14 PM' },
      { by: 'SK', a: 'Yes', t: '10-08-2026, 11:52 AM' } ] },
    { q: 'Was access to the site delayed?', bad: 'Yes', r: [
      { by: 'MT', a: 'No', t: '13-08-2026, 02:15 PM' },
      { by: 'PR', a: 'No', t: '11-08-2026, 03:07 PM' } ] },
    { q: 'Were any defects found in the contractor work?', bad: 'Yes', r: [
      { by: 'MT', a: 'Yes', t: '13-08-2026, 02:20 PM', tags: ['Document uploaded', 'Contractor notified'], files: [['Defect-report.pdf', '1.2 MB'], ['Rectification-quote.pdf', '860 KB']] },
      { by: 'PR', a: 'No', t: '11-08-2026, 03:10 PM', tags: ['Staff notified'] },
      { by: 'SK', a: 'Yes', t: '10-08-2026, 12:00 PM', tags: ['Photos uploaded'], photos: 3, note: 'Paint runs on the laundry door frame and a chipped tile at the ensuite entry.' } ] },
    { q: 'Was there a safety incident?', bad: 'Yes', r: [
      { by: 'MT', a: 'No', t: '13-08-2026, 02:22 PM' } ] },
    { q: 'Was a permit needed for this job?', bad: null, r: [
      { by: 'MT', a: 'Yes', t: '13-08-2026, 02:24 PM', tags: ['Document uploaded'], files: [['Permit.pdf', '1.1 MB']] } ] },
    { q: 'Safety barriers and signage in position?', bad: 'No', r: [
      { by: 'MT', a: 'Yes', t: '13-08-2026, 02:26 PM' } ] },
    { q: 'Is the area safe to hand back?', bad: 'No', r: [
      { by: 'MT', a: 'Yes', t: '13-08-2026, 02:30 PM' },
      { by: 'SK', a: 'Yes', t: '10-08-2026, 12:04 PM' } ] },
    { q: 'Was any damage found on site?', bad: 'Yes', r: [
      { by: 'MT', a: 'No', t: '13-08-2026, 02:34 PM' },
      { by: 'SK', a: 'No', t: '10-08-2026, 12:06 PM' } ] },
  ];
  Q.forEach((c, i) => {
    c.i = i;
    c.flagged = c.r.some(x => x.a === c.bad);
    c.mixed = new Set(c.r.map(x => x.a)).size > 1;
  });

  const IC = {
    chev: '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
    flag: '<svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
    check: '<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>',
    history: '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg>',
    pdf: '<svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>',
    eye: '<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    dl: '<svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>',
    x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    left: '<svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>',
    right: '<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
    note: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
    bell: '<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/></svg>',
    doc: '<svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/></svg>',
    img: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
    send: '<svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>',
    clip: '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4v2h6V4M9 13l2 2 4-4"/></svg>',
  };
  const TAG_IC = { 'Note added': IC.note, 'Staff notified': IC.bell, 'Contractor notified': IC.send, 'Document uploaded': IC.doc, 'Photos uploaded': IC.img };

  // Stand-in site photos until real uploads are wired up.
  const TONES = [['#c9b48a', '#7d8f5a'], ['#a8b8c8', '#8a7a5c'], ['#b9a07a', '#5f7048']];
  const photoSvg = i => { const [a, b] = TONES[i % 3]; return `<svg viewBox="0 0 96 72" preserveAspectRatio="xMidYMid slice" style="stroke:none"><rect width="96" height="72" fill="${a}"/><path d="M0 52 26 34l18 12 20-18 32 26v18H0z" fill="${b}"/><circle cx="70" cy="18" r="7" fill="#fff" opacity=".7"/></svg>`; };

  const $ = id => document.getElementById(id);
  // `logs` is the question whose logs are showing in the right-hand panel (or null).
  const state = { open: new Set([4]), logs: null };
  const isBad = (c, a) => a === c.bad;

  function summary(c){
    // Unanimous → one chip. Mixed → "2 Yes · 1 No" split, coloured by meaning.
    const counts = {};
    c.r.forEach(x => { counts[x.a] = (counts[x.a] || 0) + 1; });
    const parts = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    return `<span class="ans-split">${parts.map(([a, n]) => `<span class="${isBad(c, a) ? 'a-bad' : 'a-ok'}">${isBad(c, a) ? IC.flag : IC.check}${c.mixed ? `${n} ` : ''}${a}</span>`).join('')}</span>`;
  }
  function responseHtml(c, x){
    return `<div class="resp"><div class="avatar md av-${x.by}">${x.by}</div><div class="resp-main">
      <div class="resp-head"><b>${PEOPLE[x.by]}</b><span class="ans ${isBad(c, x.a) ? 'a-bad' : 'a-ok'}">${isBad(c, x.a) ? IC.flag : IC.check}${x.a}</span><time>${x.t}</time>
        ${x.tags ? `<span class="tags">${x.tags.map(t => `<span class="tag">${TAG_IC[t] || ''}${t}</span>`).join('')}</span>` : ''}</div>
      ${x.note ? `<div class="note"><b>Note:</b> ${x.note}</div>` : ''}
      ${x.files ? `<div class="files">${x.files.map(([n, s]) => `<div class="file"><div class="file-ic">${IC.pdf}</div><div><div class="file-name">${n}</div><div class="file-sub">PDF · ${s}</div></div>
        <div class="file-actions"><button class="icon-btn" aria-label="Preview ${n}" data-toast="Opening ${n}">${IC.eye}</button><button class="icon-btn" aria-label="Download ${n}" data-toast="Downloading ${n}">${IC.dl}</button></div></div>`).join('')}</div>` : ''}
      ${x.photos ? `<div class="photos">${Array.from({ length: x.photos }, (_, k) => `<div class="thumb" role="img" aria-label="Photo ${k + 1} of ${x.photos}">${photoSvg(k)}</div>`).join('')}</div>` : ''}
    </div></div>`;
  }
  function questionHtml(c){
    const open = state.open.has(c.i);
    const badCount = c.r.filter(x => isBad(c, x.a)).length;
    return `<div class="q${c.flagged ? ' flagged' : ''}${open ? ' open' : ''}${state.logs === c.i ? ' logs-on' : ''}" id="q-${c.i}">
      <div class="q-row" data-toggle="${c.i}" role="button" aria-expanded="${open}">
        <span class="num">${c.i + 1}</span>
        <span class="q-text">${c.q}</span>
        <span class="q-sum">${summary(c)}${c.flagged ? `<span class="pill red">${IC.flag}Flagged</span>` : ''}
          <span class="count">${c.r.length} ${c.r.length === 1 ? 'response' : 'responses'}</span>
          <button class="logs-link${state.logs === c.i ? ' on' : ''}" data-logs="${c.i}" aria-label="View logs for question ${c.i + 1}">${IC.history}<span class="lbl">View logs</span></button>
          <span class="chev">${IC.chev}</span></span>
      </div>
      ${open ? `<div class="q-body">
        ${c.flagged ? `<div class="verdict bad">${IC.flag}<span><b>${badCount} of ${c.r.length}</b> answered “${c.bad}” — flagged.</span></div>`
          : c.mixed ? '' : `<div class="verdict ok">${IC.check}<span>All ${c.r.length > 1 ? c.r.length + ' ' : ''}answered “${c.r[0].a}” — as expected.</span></div>`}
        ${c.r.map(x => responseHtml(c, x)).join('')}
      </div>` : ''}
    </div>`;
  }
  function render(){
    $('qlist').innerHTML = Q.map(questionHtml).join('');
    const on = state.logs != null;
    $('wrap').classList.toggle('with-logs', on);
    $('logs').hidden = !on;
    $('logs').innerHTML = on ? logsPanelHtml(state.logs) : '';
  }

  // ---- View logs: everything that happened on one question, newest first, in the right-hand panel ----
  function logsPanelHtml(i){
    const c = Q[i];
    const events = [];
    events.push({ kind: 'submit', t: '13-08-2026, 02:40 PM', html: `<b>Checklist submitted</b>&nbsp;by Mike T.`, lines: [[IC.clip, `Q${i + 1} locked as <b>${c.flagged ? 'Flagged' : 'As expected'}</b>`]] });
    c.r.forEach(x => events.push({ kind: 'resp', by: x.by, t: x.t,
      html: `<b>${PEOPLE[x.by]}</b> answered <span class="ans ${isBad(c, x.a) ? 'a-bad' : 'a-ok'}">${x.a}</span>`,
      lines: [
        ...(isBad(c, x.a) ? [[IC.flag, 'Question flagged']] : []),
        ...(x.tags || []).filter(t => !(t === 'Note added' && x.note)).map(t => [TAG_IC[t] || IC.check, t === 'Staff notified' ? 'Staff notified → Amelia Marsh' : t === 'Contractor notified' ? 'Contractor notified → Amelia Marsh' : t === 'Document uploaded' ? `Uploaded ${(x.files || []).map(f => f[0]).join(', ')}` : t === 'Photos uploaded' ? `Uploaded ${x.photos} photos` : t]),
        ...(x.note ? [[IC.note, `“${x.note}”`]] : []),
      ] }));
    events.push({ kind: 'sent', t: '10-08-2026, 09:00 AM', html: '<b>Checklist sent to crew</b>', lines: c.bad ? [[IC.flag, `Flag rule: answer “${c.bad}” flags the question`]] : [] });
    const sorted = [events[0], ...events.slice(1, -1).sort((a, b) => toDate(b.t) - toDate(a.t)), events[events.length - 1]];
    return `<div class="lp-head"><div>
        <div class="lp-eyebrow">${IC.history}View logs · Question ${i + 1} of ${Q.length}</div>
        <h2>${c.q}</h2>
        <div class="lp-nav">${c.flagged ? '<span class="pill red">Flagged</span>' : '<span class="pill green">As expected</span>'}<span class="pill grey">${c.r.length} ${c.r.length === 1 ? 'answer' : 'answers'}</span></div>
      </div><button class="icon-btn" data-close-logs aria-label="Close logs">${IC.x}</button></div>
      <div class="lp-body"><div class="tl">${sorted.map(e => `<div class="ev">${e.by ? `<div class="avatar sm av-${e.by}">${e.by}</div>` : `<span class="dot">${e.kind === 'submit' ? IC.check : IC.clip}</span>`}
        <div class="ev-top"><span>${e.html}</span><time>${e.t}</time></div>
        ${e.lines.length ? `<div class="ev-sub">${e.lines.map(([ic, txt]) => `<div class="ev-line">${ic}<span>${txt}</span></div>`).join('')}</div>` : ''}</div>`).join('')}</div></div>`;
  }
  function toDate(s){ const [d, m, y, h, mi, ap] = s.match(/(\d+)-(\d+)-(\d+), (\d+):(\d+) (AM|PM)/).slice(1); return new Date(+y, m - 1, +d, (+h % 12) + (ap === 'PM' ? 12 : 0), +mi); }

  let toastTimer;
  function toast(msg){
    let t = document.getElementById('toast');
    if (!t){ t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16181c;color:#fff;font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:9px;z-index:30;'; document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 1600);
  }

  document.addEventListener('click', e => {
    const t = e.target;
    const logs = t.closest('[data-logs]');
    if (logs){
      // Same question again closes the panel; another question switches it.
      const i = Number(logs.dataset.logs);
      state.logs = state.logs === i ? null : i;
      render();
      return;
    }
    if (t.closest('[data-close-logs]')) { state.logs = null; render(); return; }
    const msg = t.closest('[data-toast]');
    if (msg){ toast(msg.dataset.toast); return; }
    const tog = t.closest('[data-toggle]');
    if (tog){ const i = Number(tog.dataset.toggle); state.open.has(i) ? state.open.delete(i) : state.open.add(i); render(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.logs != null) { state.logs = null; render(); } });
  render();
  // Deep links for sharing a view: #q5 opens question 5, #logs5 opens it with its logs.
  const deep = location.hash.match(/^#(q|logs)(\d+)$/);
  if (deep){
    const i = Number(deep[2]) - 1;
    if (Q[i]){ state.open.add(i); if (deep[1] === 'logs') state.logs = i; render(); $(`q-${i}`).scrollIntoView({ block: 'start' }); }
  }
</script>
</body>
</html>
